<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photos - ElmorePlus</title>
<style>
:root{--ink:#5b5f68;--bar-fill:#6da7d1;--bar-edge:#4fe0a8;--act:#1c5bbd;--page:#f3f5fa;--line:#c7cbd6;--tan:#a9865a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);font-family:"Trebuchet MS",Verdana,Arial,sans-serif;min-height:100%;display:flex;flex-direction:column}
.win{flex:1;display:flex;flex-direction:column}
.page{background:var(--page);flex:1;display:flex;flex-direction:column}
.head{margin:34px 18px 30px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:0 22px 0 0;min-height:72px;background:var(--bar-fill);border-top:6px solid var(--bar-edge);border-bottom:6px solid var(--bar-edge)}
.logo{--lh:112px;position:relative;flex:none;width:calc(var(--lh)*3.143);height:60px}
.logo img{position:absolute;left:0;top:50%;height:var(--lh);width:auto;max-width:none;transform:translateY(-50%);display:block}
nav{display:flex;gap:8px;margin-left:8px}
nav a{display:block;text-decoration:none;font:700 13px "Trebuchet MS",Verdana,sans-serif;letter-spacing:1px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);padding:10px 16px}
nav a:hover{background:rgba(255,255,255,.15)}
nav a.on{background:var(--act);box-shadow:inset 0 0 0 1px #6aa5ec}
.mail{margin-left:auto;display:flex;align-items:center;justify-content:center;width:46px;height:46px;text-decoration:none}
.mail:hover{background:rgba(255,255,255,.15)}
.mail svg{display:block;width:28px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.mail.on{background:var(--act);box-shadow:inset 0 0 0 1px #6aa5ec}
.mail:focus-visible{outline:2px solid #ffd54a;outline-offset:2px}
.srch{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:1px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);font-weight:700}
.srch input{width:190px;height:28px;border:0;border-radius:0;padding:0 12px;background:#f4f8ff;font-size:13px;outline:0}
.srch input:focus{box-shadow:0 0 0 2px #ffd54a}
.body{display:grid;grid-template-columns:210px minmax(0,1fr) 280px;flex:1}
.side{border-right:2px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.pname{font:700 15px "Trebuchet MS",Verdana,sans-serif;letter-spacing:.5px;color:#2e7bd0;align-self:flex-start;overflow-wrap:anywhere}
.big{display:flex;width:100%;gap:3px;background:linear-gradient(#dbeeff,#a9d0f5);border:2px solid #4a8fd8;border-radius:10px;padding:6px;text-decoration:none}
.big:hover,.big:focus-visible{box-shadow:0 0 0 2px #ffd54a;outline:0}
.cap{align-self:flex-start;font:700 9px "Trebuchet MS",sans-serif;letter-spacing:.3px;color:#9aa0aa}
.cap a{margin-left:6px;color:#4a8fd8;text-decoration:none}
.msg{align-self:flex-start;padding:6px 12px;background:#d4ecf8;border:2px solid #6aaee0;border-radius:3px;color:#2e7bd0;font:700 13px "Trebuchet MS",Verdana,sans-serif;text-decoration:none}
.msg.on{background:#2a6fcf;border-color:#1c5bbd;color:#fff}
.sec{align-self:stretch;margin-top:8px}
.sech{display:flex;align-items:center;gap:8px;font:700 14px "Trebuchet MS",Verdana,sans-serif;color:#2e7bd0}
.sech .ic{width:32px;height:28px;flex:none}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 2px}
.th{display:block;position:relative;aspect-ratio:4/3;border:1px solid #8aa0b8;overflow:hidden;background:#fff}
.th svg{display:block;width:100%;height:100%}
.vid{width:100%;margin-top:8px}
.play{position:absolute;inset:0;margin:auto;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45)}
.play::after{content:"";position:absolute;left:11px;top:8px;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
.more2{display:block;text-align:right;font-size:9px;color:#4a8fd8;text-decoration:none}
.av{display:block;overflow:hidden;background:#fff}.av svg{display:block;width:100%;height:100%}
.main{padding:12px 20px 18px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:0 0 14px}
.ph h1{margin:0;font:700 24px "Trebuchet MS",Verdana,sans-serif;letter-spacing:2px;color:var(--act)}
.add{position:relative;display:inline-flex;align-items:center;gap:10px;color:var(--act);font:700 13px "Trebuchet MS",Verdana,sans-serif;letter-spacing:1.5px;cursor:pointer}
.add .sq{width:48px;height:48px;display:grid;place-items:center;background:var(--bar-fill);border-top:4px solid var(--bar-edge);border-bottom:4px solid var(--bar-edge)}
.add .sq svg{width:24px;height:24px;fill:#fff}
.add:hover .sq{background:#5d96c1}
.add:focus-within{outline:2px solid #ffd54a;outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.tabs button{min-height:40px;padding:0 16px;border:2px solid #4a8fd8;background:#fff;color:var(--act);font:700 11px "Trebuchet MS",sans-serif;letter-spacing:1px;cursor:pointer}
.tabs button.on{background:#2a6fcf;border-color:#1c5bbd;color:#fff}
.note{min-height:18px;margin:0 0 8px;font:700 12px "Trebuchet MS",Verdana,sans-serif;color:#2e7bd0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;max-width:760px}
.tile{position:relative;display:block;aspect-ratio:4/3;padding:0;overflow:hidden;border:3px solid #4a8fd8;border-radius:6px;background:#fff;cursor:pointer}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font:700 11px "Trebuchet MS",sans-serif;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile:hover,.tile:focus-visible{box-shadow:0 0 0 3px #ffd54a;outline:0}
.lb{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:70px 14px 14px;background:rgba(10,20,40,.9)}
.lb[hidden]{display:none}
.lb figure{margin:0;max-width:min(92vw,760px);text-align:center;color:#fff}
.lb img{display:block;max-width:100%;max-height:60vh;margin:0 auto;border:3px solid #55595f;border-radius:6px;background:#fff}
.lb figcaption{margin:10px 0 4px;font-size:15px;overflow-wrap:anywhere}
.lbc{font-size:11px;letter-spacing:1px;color:#9fb6d6}
.lbact{display:flex;justify-content:center;gap:10px;margin-top:12px}
.lbact a,.lbact button{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:0;background:var(--act);color:#fff;font:700 11px "Trebuchet MS",sans-serif;letter-spacing:1px;text-decoration:none;cursor:pointer}
.lbact .del{background:#c0392b}
.lbx,.lbn{position:absolute;width:48px;height:48px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:30px;line-height:1;cursor:pointer}
.lbx{top:14px;right:14px}
.lbn{top:50%;transform:translateY(-50%)}.lbn.l{left:14px}.lbn.r{right:14px}
.lbx:hover,.lbn:hover{background:rgba(255,255,255,.3)}
body.lock{overflow:hidden}
.fl{display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 8px}
.fl a{display:flex;flex-direction:column;align-items:center;gap:2px;font:700 11px "Trebuchet MS",sans-serif;color:#8a8e98;text-decoration:none}
.fl .av{width:62px;height:62px;border:2px solid #4a8fd8;border-radius:4px}
.fl a:hover .av,.fl a:focus-visible .av{box-shadow:0 0 0 3px #ffd54a}
.fl a:focus-visible{outline:0}
.tip{margin-top:16px;padding:10px 14px;background:#c9f0f2;border:2px solid #5fb0e0;border-radius:12px;font-size:12px;line-height:1.55;color:var(--ink)}
.tip h3{margin:0 0 6px;font:700 16px "Trebuchet MS",sans-serif;color:#2e7bd0}
.right{padding:12px 14px;min-width:0}
.fh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px;padding-bottom:2px;border-bottom:3px solid #4a8fd8;font:700 24px "Trebuchet MS",Verdana,sans-serif;color:#2e7bd0}
.fh span{font-size:15px}
.none{margin:10px 0;font-size:13px;color:#8a8e98}
.fbh{display:flex;justify-content:space-between;align-items:baseline;font:700 16px "Trebuchet MS",Verdana,sans-serif;color:#2e7bd0}
.fbh span{font-size:11px}
.fcount{margin:4px 0 6px;font:700 12px "Trebuchet MS",Verdana,sans-serif;color:#86bddd}
.inv{display:block;font:700 12px "Trebuchet MS",Verdana,sans-serif;color:#1c4f9c}
.inv input{display:block;width:100%;height:30px;margin-top:6px;padding:0 10px;border:2px solid #4a8fd8;border-radius:6px;background:#fff;font:13px "Trebuchet MS",Verdana,sans-serif}
.inv input:focus{outline:0;box-shadow:0 0 0 2px #ffd54a}
.sfoot{margin:14px 18px 18px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 18px;background:var(--bar-fill);border-top:6px solid var(--bar-edge);border-bottom:6px solid var(--bar-edge);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);font:700 10px "Trebuchet MS",Verdana,sans-serif;letter-spacing:1px}
.sfoot b{font-size:13px}
.sfoot .note2{flex-basis:100%;font-weight:400;font-size:11px;letter-spacing:.3px}
.sfoot .note{flex-basis:100%;font-weight:400;font-size:11px;letter-spacing:.3px}
nav a:focus-visible,.logo:focus-visible,.tabs button:focus-visible,.lbact a:focus-visible,.lbact button:focus-visible,.lbx:focus-visible,.lbn:focus-visible{outline:2px solid #ffd54a;outline-offset:2px}
@media (max-width:700px){
  .head{gap:10px;margin:28px 10px 24px;min-height:0;padding:0 14px 0 0}.logo{--lh:84px;height:56px}.sfoot{margin:10px}
  nav{margin-left:0;flex-wrap:wrap}nav a{padding:10px 12px;font-size:12px}.srch{margin-left:0;width:100%}.srch input{flex:1}
  .body{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:2px solid var(--line);justify-content:center}
  .pname,.big,.cap,.sec{display:none}.main{padding:12px 8px}.right{padding:12px 8px}}
@media (max-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.lbn.l{left:6px}.lbn.r{right:6px}.lbn{width:42px}}
</style>
</head>

  const np=P.filter(p=>p.m&&p.m.length).length,l=items();
  $('#main').innerHTML=`<div class="ph"><h1>PHOTOS</h1><label class="add"><span class="sq">${PLUS}</span>ADD PHOTO<input type="file" id="pf" class="vh" accept="image/*" multiple></label></div>
  <div class="tabs"><button type="button" data-t="mine" aria-pressed="${S.tab==='mine'}" class="${S.tab==='mine'?'on':''}">MY PHOTOS (${PH.length})</button><button type="button" data-t="posts" aria-pressed="${S.tab==='posts'}" class="${S.tab==='posts'?'on':''}">FROM POSTS (${np})</button></div>
  <p class="note" role="status">${esc(S.note)}</p>
  ${l.length?`<div class="grid">${l.map((x,i)=>`<button type="button" class="tile" data-o="${i}" aria-label="Open photo: ${esc(x.cap)}"><img src="${esc(x.src)}" alt=""><span>${esc(x.cap)}</span></button>`).join('')}</div>`:`<p class="none">${S.q.trim()?'No photos match your search.':S.tab==='mine'?'No photos yet. Press ADD PHOTO to upload one.':'No photos from posts yet.'}</p>`}`;
}
function right(){
  const fl=F.map(f=>[cap(f.id),f.c,f.k,'account.html?user='+f.id]).concat(R.friends.map(x=>[x,pal(x),x.length%5,'account.html?user='+encodeURIComponent(x)]));
  $('#right').innerHTML=`<h2 class="fh">FRIENDS<span>(${fl.length})</span></h2><div class="fl">${fl.map(x=>`<a href="${x[3]}"><span class="av">${av(x[1],x[2])}</span>${esc(x[0])}</a>`).join('')}</div>
  <div class="tip"><h3>Tips</h3>Click a photo to enlarge it. Use the arrow keys to move between photos and Esc to close. Photos you add are saved in this browser.</div>`;
}
const lb=$('#lb');
function showLb(){
  const l=items(),x=l[S.open];if(!x){closeLb();return}
  $('#lbimg').src=x.src;$('#lbimg').alt=x.cap;$('#lbcap').textContent=x.cap;
  $('#lbc').textContent=(S.open+1)+' / '+l.length+(x.by?' \u00B7 posted by '+x.by:'');
  $('#lbact').innerHTML=x.post?`<a href="friends.html#post-${x.post}">OPEN POST</a>`:`<button type="button" class="del" id="del" data-id="${x.id}">${S.armed===x.id?'CLICK AGAIN TO DELETE':'DELETE'}</button>`;
  lb.querySelectorAll('.lbn').forEach(b=>b.hidden=l.length<2);
  lb.hidden=false;document.body.classList.add('lock');
}
function closeLb(){lb.hidden=true;S.open=-1;S.armed=null;document.body.classList.remove('lock');if(S.opener&&S.opener.focus)S.opener.focus()}
function step(d){const n=items().length;if(n<2)return;S.open=(S.open+d+n)%n;S.armed=null;showLb()}
function shrink(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.onerror=()=>cb(null);im.src=r.result};r.onerror=()=>cb(null);r.readAsDataURL(file)}
document.addEventListener('click',e=>{
  if(e.target.id==='lb'){closeLb();return}
  const t=e.target.closest('[data-t]'),o=e.target.closest('[data-o]'),n=e.target.closest('[data-lb]');
  if(t){S.tab=t.dataset.t;S.note='';render();return}
  if(o){S.opener=o;S.open=+o.dataset.o;showLb();$('#lbclose').focus();return}
  if(e.target.closest('#lbclose')){closeLb();return}
  if(n){step(+n.dataset.lb);return}
  const d=e.target.closest('#del');
  if(d){
    const id=+d.dataset.id;
    if(S.armed!==id){S.armed=id;showLb();return}
    PH=PH.filter(p=>p.id!==id);savePH();S.armed=null;S.note='Photo deleted.';
    const left=items().length;render();
    if(!left)closeLb();else{S.open=Math.min(S.open,left-1);showLb()}
  }
});
document.addEventListener('keydown',e=>{
  if(lb.hidden)return;
  if(e.key==='Escape'){closeLb();return}
  if(e.key==='ArrowLeft'){step(-1);return}
  if(e.key==='ArrowRight'){step(1);return}
  if(e.key==='Tab'){const f=[...lb.querySelectorAll('button,a')].filter(x=>!x.hidden),a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
document.addEventListener('change',async e=>{
  if(e.target.id!=='pf')return;
  const files=[...e.target.files];if(!files.length)return;
  const added=[];let bad=0;
  for(const f of files){
    const d=await new Promise(r=>shrink(f,r));if(!d){bad++;continue}
    const id=PH.reduce((m,p)=>Math.max(m,p.id),0)+1;
    PH.unshift({id,src:d,cap:(f.name.replace(/\.[^.]+$/,'')||'Photo').slice(0,40)});added.push(id);
  }
  if(added.length&&!savePH()){PH=PH.filter(p=>!added.includes(p.id));S.note='Storage is full, so the photo was not saved.'}
  else S.note=added.length?plural(added.length,'photo')+' added.'+(bad?' '+plural(bad,'file')+' could not be read.':''):'Could not read that photo.';
  S.tab='mine';render();
});
$('#q').addEventListener('input',e=>{S.q=e.target.value;render()});
side();right();render();
</script>
</body>
</html>
